# 应物音形足下输入法 —— 部件命名表
#
# 形码取部件「名称」的拼音首字母，不是部件自身的读音：
#   宀 读 gài，人人叫它「宝盖」，故取 b
#   氵 人人叫它「水」，故取 s
#
# 一个部件可以有多个名称。这不是含糊，是承认现实：
#   彳 有人叫「双人旁」(s)，有人读它本音 chì (c)
#   冂 有人叫「同字框」(t)，有人读 jiōng (j)
# 两种叫法都收，两个码都认。打不出来的码等于没有，宁可多收。
#
# 本文件只列**需要人工判断**的部件。其余部件由生成器按自身读音自动取码——
# 那些部件的名称就是它本身（青、工、又、田……），读音即通称，不必登记。
#
# 格式：部件: [名称, 名称, ...]

