# ---------------------------------------------------- 别名：看得见的子部件
#
# 这一段不是「这个部件叫什么」，而是「这个部件里能看见什么」。鹏 里看得见
# 月，打 y 就该出鹏。做法不是把 IDS 再递归一层——那样会拿到 艹＝十、⺼＝冫
# 这种没人看得见的东西，还要全体字为它买单——而是一条一条人工过目。
#
# 每条都由 TYZPKAW 逐个确认（2026-09-27，data-tools 生成候选表 200 行，
# 人工勾选）。加一条就多一个码，代价见 docs/方案升级审计.md。
# 名单是开的：以后随时可以加，加完重跑 generate_zuxia.py 与 measure_zuxia.py。
足: [足, 口]           # 足 上半是口
禾: [禾, 木]           # 禾 去掉一撇就是木
大: [大, 人]           # 大 是人加一横
穴: [穴, 宝盖]         # 穴 头上是宝盖
羽: [羽, 习]           # 羽 是两个习
戈: [戈, 弋]           # 戈 是弋加一撇
户: [户, 尸]           # 户 下半是尸
鱼: [鱼, 田]           # 鱼 中间是田（一 的字母与鱼本身同为 y，不另收）
