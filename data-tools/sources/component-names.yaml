# ---------------------------------------------------- 别名：看得见的子部件
#
# 这一段不是「这个部件叫什么」，而是「这个部件里能看见什么」。鹏 里看得见
# 月，打 y 就该出鹏。
#
# 做法不是把 IDS 再递归一层。那样会拿到 艹＝十、⺼＝冫、火＝八人、马＝②
# 这类没人看得见的东西，而它们恰恰覆盖面最广（艹 451 字、土 244 字、王
# 191 字），要全体字替它们买单。实测全递归：单字打满首选 98.27%→97.64%，
# 词组打满两部件 99.40%→97.83%。所以改成一条一条过目。
#
# 收录标准三条，缺一不收：
#   1. 子部件在母部件里**看得见**，不是笔画树凑出来的；
#   2. 子部件有**通行叫法**，字母猜得到（䒑 没有读音也没有通名，不收）；
#   3. 新字母与母部件原有字母**不同**（鱼 里的「一」= y，与 鱼 本身同码，不收）。
#
# 前八条由 TYZPKAW 逐条勾选（2026-09-27）。其余由 AI 按上述三条从 1,256 个
# 候选里筛出，**未经人工逐条复核** —— 拿不准的一律没收，宁缺毋滥。
# 名单是开的：加一条重跑 generate_zuxia.py 与 measure_zuxia.py 即可。

