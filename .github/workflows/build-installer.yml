# 出 ZuxiaSetup-<版本>.exe。
#
# 这台开发机是 Linux，编译不了 MSVC；windows runner 自带 VS2022、CMake、
# Windows SDK（rc.exe）、makecab 和 7-Zip，正好补上这一段。librime 由
# scripts/fetch-librime.ps1 从官方 release 取，SHA-256 在脚本里钉死。
#
# 两个 job：先在 Linux 上验码表（快，失败就不用编了），再在 Windows 上
# 编译、跑引擎断言、打包。产物在 Actions 页面的 Artifacts 里下载。
name: build-installer

on:
  push:
    branches: [master]
    # 打 v* 标签会额外发一个 Release，见最后一步。
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data:
    name: 码表不变量
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 词组码表不进 git（42 万行 12 MB），这里生成一次当作冒烟测试：
      # 生成器炸了，下面那个 job 编出来的安装包会是个哑巴输入法。
      - name: generate_phrases.py
        run: |
          python data-tools/generate_phrases.py
          python - <<'PY'
          import pathlib
          p = pathlib.Path("data/zuxia.extended.dict.yaml")
          rows = sum(1 for line in p.open(encoding="utf-8") if "\t" in line)
          print(f"{rows} 行, {p.stat().st_size} 字节")
          assert rows > 300000, "词组码表行数不对"
          PY

      # --regen 会重跑两次生成器并逐字节比对，同时验证仓库里的词典就是
      # 当前源码的产物。码表被手改过、生成器不确定，这一步就会红。
      - name: audit_zuxia.py --regen
        run: python data-tools/audit_zuxia.py --regen

      # 列式解码器：词库里没有的词也要能拼出来。11 条用例覆盖单字退化、
      # 无部件字补位、结构位非法字母必须拒绝。
      - name: decode_zuxia.py --selftest
        run: python data-tools/decode_zuxia.py --selftest

      # C++ 侧解码器自检：与上面 Python 自检同用例。用仓库自带的小 Win32
      # 桩头在 Linux 上直接编 Decoder.cpp，11 条断言全过才放行。
      - name: C++ 解码器自检（Linux）
        run: |
          g++ -std=c++17 -O2 -Itools/linux-selftest -Isrc \
              -o /tmp/dselftest tools/linux-selftest/decoder-selftest.cpp src/Decoder.cpp
          /tmp/dselftest

      - name: 编码质量（留在日志里备查）
        run: python data-tools/measure_zuxia.py data/zuxia.dict.yaml --labels "足下 $(cat VERSION)"

  installer:
    name: 编译与打包
    needs: data
    runs-on: windows-latest
    # 只为最后那一步发 Release 用。GitHub 不支持按条件给权限，所以这个
    # job 一直带着写权限 —— 这也是下面宁可用自带的 gh 命令、不引第三方
    # action 的原因：能动仓库的东西越少越好。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 必须在 build.ps1 之前：cmake --install 把 data\*.yaml 拷进
      # dist\Zuxia\，安装包就是从那里打的。
      - name: 生成词组码表
        shell: pwsh
        run: python data-tools/generate_phrases.py

      - name: 读出版本号
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "版本 $v"

      # 仓库里已经带了 third_party/librime/*/dist/lib/rime.dll，脚本会跳过
      # 下载；万一是浅克隆或将来把它从仓库里拿掉了，这一步兜住。
      - name: 取 librime 1.17.0
        shell: pwsh
        run: pwsh scripts/fetch-librime.ps1

      - name: 编译 x64 + x86
        shell: pwsh
        run: pwsh scripts/build.ps1 -Arch all -Configuration Release

      # engine-test 必须在 x64\ 目录里跑：RimeEngine 从自己的模块路径找
      # rime.dll 和 ..\data，和文本服务运行时的行为一致。
      # 断言输出要留一份到产物里。只有 pass/fail 是不够的：有几条断言会在
      # 环境不满足时自己跳过（比如模拟 Shift 没起作用），光看「绿了」分不出
      # 「跑过并通过」和「跳过了」—— 而那两件事的结论完全不同。
      - name: 引擎断言
        shell: pwsh
        run: |
          pwsh tools/build-engine-test.ps1 -Arch x64
          Copy-Item tools/engine-test.exe dist/Zuxia/x64/ -Force
          Push-Location dist/Zuxia/x64
          .\engine-test.exe 2>&1 | Tee-Object -FilePath ../engine-test.log
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "engine-test 有断言没过" }

      - name: 打单文件安装包
        shell: pwsh
        run: pwsh installer/setup/make-setup.ps1 -SkipBuild

      - name: 核对载荷清单
        shell: pwsh
        run: |
          Get-Content dist/Zuxia/MANIFEST.sha256 | Measure-Object -Line
          Get-Content "dist/ZuxiaSetup-$($env:ZX_VERSION).exe.sha256"
        env:
          ZX_VERSION: ${{ steps.ver.outputs.version }}

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: ZuxiaSetup-${{ steps.ver.outputs.version }}
          path: |
            dist/ZuxiaSetup-*.exe
            dist/ZuxiaSetup-*.exe.sha256
            dist/Zuxia/MANIFEST.sha256
            dist/Zuxia/engine-test.log
          if-no-files-found: error
          retention-days: 30

      # 暂存目录本身也留一份：想手工核对某个 DLL 或用
      # scripts/verify-install.ps1 逐文件比对时用得上。
      - name: 上传暂存目录
        uses: actions/upload-artifact@v4
        with:
          name: Zuxia-stage-${{ steps.ver.outputs.version }}
          path: dist/Zuxia
          if-no-files-found: error
          retention-days: 7

      # 上面那两份产物要登录 GitHub 才能下，而且 30 天后就没了。请人试用
      # 得有个不用登录、不会过期的链接，所以打 v* 标签时顺手发一个 Release。
      # 用 runner 自带的 gh，不引第三方 action。
      - name: 发布 Release（仅 v* 标签）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ZX_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $v = $env:ZX_VERSION
          $tag = $env:GITHUB_REF_NAME
          $files = @(
            "dist/ZuxiaSetup-$v.exe",
            "dist/ZuxiaSetup-$v.exe.sha256",
            "dist/Zuxia/MANIFEST.sha256",
            "dist/Zuxia/engine-test.log")
          # 在网页上点「Publish release」会先把 Release 建好再推标签，这时候
          # create 会撞车。两条路都得走得通，所以先看一眼有没有。
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag 已存在，补挂产物"
            gh release upload $tag @files --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload 失败" }
            gh release edit $tag --title "足下输入法 $v" --notes-file installer/RELEASE-NOTES.md
            if ($LASTEXITCODE -ne 0) { throw "gh release edit 失败" }
          } else {
            gh release create $tag @files --title "足下输入法 $v" --notes-file installer/RELEASE-NOTES.md
            if ($LASTEXITCODE -ne 0) { throw "gh release create 失败" }
          }
